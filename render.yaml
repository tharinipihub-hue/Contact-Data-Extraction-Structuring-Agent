services:
  - type: web
    name: contact-data-extraction-agent
    runtime: node
    rootDir: contact-agent/backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: OCR_SPACE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: PUBLIC_APP_URL
        value: https://contact-data-extraction-structuring-agent.onrender.com
    disk:
      name: contact-agent-data
      mountPath: /var/data
      sizeGB: 1
